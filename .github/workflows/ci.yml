name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_projection_quality.py
      - run: python scripts/check_vendor_assets.py
      - run: python -m compileall -q draft_assistant tests scripts
      - run: node scripts/check_web_syntax.js
      - name: Verify installed web assets
        run: python -c "from importlib.resources import files; assert (files('draft_assistant') / 'web/static/index.html').is_file()"

  windows-package:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Builds and smoke-tests the unpacked app. Compiling the Inno Setup
      # installer is skipped here — that runs in release.yml, and this job only
      # needs to catch a bundle that is missing a data file or hidden import.
      - run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -SkipInstaller
        shell: pwsh
      - run: if (!(Test-Path .\dist\pyinstaller\DraftAssistant\DraftAssistant.exe)) { throw "packaged exe missing" }
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: DraftAssistant-windows
          path: dist/pyinstaller/DraftAssistant
          if-no-files-found: error
