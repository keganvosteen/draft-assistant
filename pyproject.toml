[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "draft-assistant"
version = "1.0.0"
description = "Fantasy football draft assistant with a Monte Carlo rest-of-draft recommendation engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Kegan Vosteen" }]
keywords = ["fantasy-football", "draft", "monte-carlo"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Environment :: Web Environment",
]
# The core app is stdlib-only by design — see CLAUDE.md.
dependencies = []

[project.optional-dependencies]
desktop = ["pywebview>=4.0"]
build = ["pyinstaller>=6.6", "pywebview>=4.0"]

[project.scripts]
draft-assistant = "draft_assistant.cli:main"

[project.gui-scripts]
draft-assistant-app = "draft_assistant.desktop:run_desktop"

[tool.setuptools.packages.find]
include = ["draft_assistant*"]

[tool.setuptools.package-data]
"draft_assistant.web" = ["static/**/*"]
